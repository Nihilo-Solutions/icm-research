# Harness settings. Stage-specific settings (model, effort, tools, which L3 files to load)
# live in each stage's CONTEXT.md front matter, so the context and its config travel together.

run:
  budget_usd: 175          # hard stop for one full run; the harness refuses to start calls past this
  concurrency: 3           # parallel workers; Fable 5.2 Start tier is 500k uncached input tokens/min
  request_timeout_s: 900
  max_pause_continuations: 12   # cap on pause_turn resumes per worker

api:
  # Beta used for server-side fallback when Fable declines (security topics can trip the cyber classifier).
  fallback_beta: server-side-fallback-2026-07-01
  fallbacks: default       # "default", or "off"
  cache_ttl: 5m            # "5m" or "1h"; workers in one stage share an identical cached system prompt

tools:
  web_search:
    type: web_search_20260318
    # false = direct calls with citations attached to Claude's text (best audit trail).
    # true  = dynamic filtering through code execution (fewer tokens). Test citation behavior before switching.
    dynamic_filtering: false
    blocked_domains: []
  web_fetch:
    type: web_fetch_20260318
    max_content_tokens: 40000
    dynamic_filtering: false

verify:
  scope: all               # "all" or "risky" (time-sensitive, corrected, estimate, and Q5, Q6, Q13, Q14, Q17, baseline)
  max_claims_per_call: 12

# USD per million tokens. Source: platform.claude.com model overview pages, accessed 2026-11-10.
# Update when Anthropic changes prices. Unknown models are charged at the most expensive known rate.
pricing:
  claude-fable-5-2:  {input: 8.0, output: 40.0, cache_write_5m: 10.0, cache_write_1h: 16.0, cache_read: 0.20}
  claude-fable-5:    {input: 10.0, output: 50.0, cache_write_5m: 12.5, cache_write_1h: 20.0, cache_read: 1.0}
  claude-opus-5-5:   {input: 4.0, output: 20.0, cache_write_5m: 5.0, cache_write_1h: 8.0, cache_read: 0.20}
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_write_5m: 2.5, cache_write_1h: 4.0, cache_read: 0.10}
  web_search_per_1k: 10.0
